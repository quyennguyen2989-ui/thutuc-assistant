<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f63d6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f63d6'/%3E%3Cpath d='M8 10h16v3H8zm0 5h12v3H8zm0 5h14v3H8z' fill='%23fff'/%3E%3C/svg%3E">
  <title>Tra cứu thủ tục và văn bản</title>
  <meta name="description" content="Tra cứu thủ tục hành chính và văn bản pháp luật cho cán bộ khu vực dân cư: hồ sơ, trình tự, thời hạn, lệ phí và tình trạng hiệu lực.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
  <script>(function () { try { var t = localStorage.getItem("tchc-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();</script>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <a class="skip" href="#app">Chuyển đến nội dung</a>

  <header class="site-head">
    <div class="site-head__inner">
      <a class="brand" href="#tthc">
        <span class="brand__mark" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M7 3.5h7.5L19 8v12.5H7z"/><path d="M9.5 12h7M9.5 15.5h7"/></svg></span>
        <span class="brand__text">
          <span class="brand__name">Tra cứu thủ tục</span>
          <span class="brand__place">Khu vực dân cư · TP.HCM</span>
        </span>
      </a>
      <div class="site-head__tools">
        <nav class="tabs" aria-label="Chức năng">
          <a href="#hoidap" data-tab="hoidap">Hỏi đáp</a>
          <a href="#tthc" data-tab="tthc">Thủ tục</a>
          <a href="#vanban" data-tab="vanban">Văn bản</a>
          <a href="#capnhat" data-tab="capnhat">Cập nhật</a>
          <a href="#taikhoan" data-tab="taikhoan">Tài khoản</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" type="button">Chế độ tối</button>
      </div>
    </div>
  </header>

  <main id="app" class="page" tabindex="-1">
    <p class="state">Đang tải dữ liệu…</p>
  </main>

  <footer class="site-foot">
    <div class="site-foot__inner">
      <p id="disclaimer"></p>
      <p>
        Nguồn: <a id="source-link" href="#" target="_blank" rel="noopener">cổng Phòng CSQLHC</a>
        và <a id="vbpl-link" href="#" target="_blank" rel="noopener">vbpl.vn</a>.
      </p>
    </div>
  </footer>

  <script src="app.js?v=8"></script>
  <script>
    (function () {
      // Nút chuyển sáng/tối: nhãn nói việc sẽ xảy ra khi bấm. Không chọn thì theo cài đặt của máy.
      var root = document.documentElement;
      var button = document.getElementById("theme-toggle");
      function dangToi() {
        var chon = root.getAttribute("data-theme");
        return chon ? chon === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      }
      function hienNhan() {
        button.textContent = dangToi() ? "Chế độ sáng" : "Chế độ tối";
      }
      button.addEventListener("click", function () {
        var chon = dangToi() ? "light" : "dark";
        root.setAttribute("data-theme", chon);
        try { localStorage.setItem("tchc-theme", chon); } catch (e) {}
        hienNhan();
      });
      hienNhan();
    })();
  </script>
</body>
</html>
