name: Cập nhật dữ liệu hằng ngày

on:
  schedule:
    - cron: "0 1 * * *"   # 08:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cap-nhat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài Playwright (vbpl.vn) và pypdf (toàn văn PDF)
        run: |
          pip install playwright pypdf
          python -m playwright install --with-deps chromium

      - name: Chạy crawler (chạy lại tối đa 2 lần khi lỗi bất thường)
        id: crawler
        shell: bash
        timeout-minutes: 180   # giới hạn an toàn; một lần chạy bình thường chỉ cần khoảng 1 đến 2 giờ
        run: |
          set +e
          for lan in 1 2 3; do
            python -m crawler.update
            ma=$?
            # Mã 0: xong. Mã 3: một số nguồn lỗi tạm thời, dữ liệu đã được xuất và lưu nên không chạy lại
            # (chạy lại chỉ làm lần chạy kéo dài thêm hàng giờ). Mã 2 và 4: cổng hoặc nguồn chặn, không chạy lại.
            if [ "$ma" -eq 0 ] || [ "$ma" -eq 2 ] || [ "$ma" -eq 3 ] || [ "$ma" -eq 4 ]; then
              exit "$ma"
            fi
            if [ "$lan" -eq 3 ]; then
              echo "Lần $lan vẫn lỗi (mã $ma), dừng."
              exit "$ma"
            fi
            echo "::warning::Lần $lan lỗi bất thường (mã $ma). Chờ 5 phút rồi chạy lại."
            sleep 300
          done
        continue-on-error: true   # lỗi một nguồn vẫn lưu dữ liệu các nguồn khác; bước cuối báo lỗi

      - name: Lưu thay đổi nếu có
        if: always()
        shell: bash
        run: |
          git config user.name "cap-nhat-tu-dong"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data/thutuc.db
          if git diff --cached --quiet; then
            echo "Không có thay đổi để lưu."
            exit 0
          fi
          git commit -m "Cập nhật dữ liệu tự động"
          for lan in 1 2 3; do
            if git push; then exit 0; fi
            echo "::warning::Đẩy lên thất bại (lần $lan), thử lại sau 30 giây."
            git pull --rebase -q || git rebase --abort || true
            sleep 30
          done
          echo "::error::Không đẩy được dữ liệu lên GitHub sau 3 lần."
          exit 1

      - name: Báo lỗi nếu có nguồn không đọc được
        if: steps.crawler.outcome == 'failure'
        run: |
          echo "::error::Có nguồn lỗi hoặc bị chặn sau khi thử lại. Xem bảng Trạng thái từng nguồn trong phần tóm tắt của lần chạy."
          exit 1
